# 新 Pikafish 浮点网络自动进化：GPU 训练，CPU 搜索。
output_dir = "runs/pikafish-evolve-temperature"
bootstrap_sqlite = "eval/pikafish-selfplay-5000-d20.sqlite"
bootstrap_samples = 2048
bootstrap_epochs = 4
opening_book = "book.pgn.gz"
games_per_update = 8
selfplay_workers = 12
arena_workers = 4
queue_games = 24
max_champion_lag = 1
selfplay_nodes = 128
arena_nodes = 128
max_depth = 8
max_plies = 600
replay_capacity = 50000
train_samples_per_update = 2048
batch_size = 16
learning_rate = 0.001
arena_interval = 5
arena_pairs = 32
promotion_rate = 0.55
confidence_z = 1.96
seed = 20261001
cuda = true

# 开局库起点后的每步均先搜索，再按根着回传 q 分数采样。
# 60 个半回合内线性降温，之后保持较低温度；end=0 时后期贪心。
[temperature]
start = 0.05
end = 0.005
plies = 60
